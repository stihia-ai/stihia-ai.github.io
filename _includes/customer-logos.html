{% assign customers = site.data.customers %}
{%- assign wrapper_class = include.class | default: 'container fade-in' -%}
<section class="customer-logos {{ wrapper_class }}" aria-label="{{ customers.title }}">
  <p class="customer-logos-title">{{ customers.title }}</p>
  <ul class="customer-logos-list">
    {% for customer in customers.items %}
    <li>
      <a
        class="customer-logo"
        href="{{ customer.url }}"
        target="_blank"
        rel="noopener noreferrer"
        data-attr="customer-logo"
      >
        <img
          src="{{ customer.logo }}"
          alt="{{ customer.name }}"
          width="{{ customer.width }}"
          height="{{ customer.height }}"
          loading="lazy"
          {% if customer.brightness %}style="--logo-brightness: {{ customer.brightness }}"{% endif %}
        />
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
