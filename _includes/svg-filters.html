<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" class="svg-filters" aria-hidden="true" focusable="false">
  <defs>
    <!--
      Amber-gold duotone, softened: the image keeps a third of its own colour
      instead of going fully monochrome, and the luminance ramp is pulled most
      of the way to neutral. Highlights still sit under pill gold so the image
      stays in the dark warm field rather than bleaching to cream.
    -->
    <filter id="img-monochrome" color-interpolation-filters="sRGB">
      <!-- 0 = full grayscale, 1 = untouched. Keeps a hint of the source colour. -->
      <feColorMatrix type="saturate" values="0.35" />
      <!-- Channel spread pulled 55% toward neutral gray: same luminance ramp, faint amber cast. -->
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.0548 0.2461 0.4877 0.7301" />
        <feFuncG type="table" tableValues="0.0496 0.2191 0.4382 0.6648" />
        <feFuncB type="table" tableValues="0.0407 0.1898 0.3842 0.5854" />
      </feComponentTransfer>
    </filter>
  </defs>
</svg>
