<script>
  document.getElementById("copyright-year").textContent =
    new Date().getFullYear();

  // Close mobile navbar when a destination link is clicked (not dropdown toggles)
  document
    .querySelectorAll(".navbar-nav .nav-link:not(.dropdown-toggle), .mega-link")
    .forEach((link) => {
      link.addEventListener("click", function () {
        const navbarCollapse = document.querySelector("#navbarNav");
        if (navbarCollapse.classList.contains("show")) {
          const bsCollapse = new bootstrap.Collapse(navbarCollapse, {
            toggle: false,
          });
          bsCollapse.hide();
        }
      });
    });

  // Desktop mega menu: open on hover with a short grace delay on leave
  (function () {
    const hoverMq = window.matchMedia(
      "(min-width: 992px) and (hover: hover)",
    );
    const nav = document.querySelector(".navbar-nav");
    if (!nav) return;

    const CLOSE_DELAY_MS = 180;
    let closeTimer = null;
    let openItem = null;

    function getDropdown(item) {
      const toggle = item.querySelector(".dropdown-toggle");
      if (!toggle) return null;
      return bootstrap.Dropdown.getOrCreateInstance(toggle);
    }

    function showItem(item) {
      if (openItem && openItem !== item) {
        const prev = getDropdown(openItem);
        if (prev) prev.hide();
      }
      openItem = item;
      const dropdown = getDropdown(item);
      if (dropdown) dropdown.show();
    }

    function hideItem(item) {
      const dropdown = getDropdown(item);
      if (dropdown) dropdown.hide();
      if (openItem === item) openItem = null;
    }

    nav.addEventListener("mouseover", function (e) {
      if (!hoverMq.matches) return;
      const item = e.target.closest(".nav-item.dropdown");
      if (!item || !nav.contains(item)) return;
      if (closeTimer) {
        clearTimeout(closeTimer);
        closeTimer = null;
      }
      showItem(item);
    });

    nav.addEventListener("mouseout", function (e) {
      if (!hoverMq.matches) return;
      const item = e.target.closest(".nav-item.dropdown");
      if (!item || !nav.contains(item)) return;
      const related = e.relatedTarget;
      if (related && item.contains(related)) return;
      if (closeTimer) clearTimeout(closeTimer);
      closeTimer = setTimeout(function () {
        hideItem(item);
        closeTimer = null;
      }, CLOSE_DELAY_MS);
    });
  })();

  // Focus trap for mobile menu (WCAG 2.4.3 Focus Order)
  (function () {
    const navCollapse = document.getElementById("navbarNav");
    const toggler = document.querySelector(".navbar-toggler");
    if (!navCollapse || !toggler) return;

    function setBackgroundInert(inert) {
      for (const el of document.body.children) {
        if (el.tagName === "NAV" || el.tagName === "SCRIPT") continue;
        if (inert) el.setAttribute("inert", "");
        else el.removeAttribute("inert");
      }
    }

    navCollapse.addEventListener("show.bs.collapse", function () {
      setBackgroundInert(true);
    });

    navCollapse.addEventListener("shown.bs.collapse", function () {
      const firstLink = navCollapse.querySelector(".nav-link");
      if (firstLink) firstLink.focus();
    });

    navCollapse.addEventListener("hidden.bs.collapse", function () {
      setBackgroundInert(false);
      if (toggler.offsetParent !== null) toggler.focus();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && navCollapse.classList.contains("show")) {
        bootstrap.Collapse.getOrCreateInstance(navCollapse).hide();
      }
    });
  })();

  // Add scroll-triggered fade-in animations
  document.addEventListener("DOMContentLoaded", function () {
    document.documentElement.classList.add("js-enabled");
    const fadeEls = document.querySelectorAll(".fade-in");

    if (!("IntersectionObserver" in window)) {
      fadeEls.forEach((el) => el.classList.add("visible"));
      return;
    }

    const observerOptions = {
      root: null,
      rootMargin: "0px",
      threshold: 0.15,
    };

    const observer = new IntersectionObserver((entries, observer) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    fadeEls.forEach((el) => {
      observer.observe(el);
    });
  });
</script>
