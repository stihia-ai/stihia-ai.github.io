<!DOCTYPE html>
<html>
<head>
  <meta charset="utf8" />
  <title>Stihia API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      --docs-bg: oklch(16% 0.012 76);
      --docs-bg-darker: oklch(20% 0.013 76);
      --docs-panel: oklch(24% 0.014 76);
      --docs-band: oklch(28% 0.015 76);
      --docs-card: oklch(18% 0.012 76 / 0.93);
      --docs-border-subtle: oklch(74% 0.025 72 / 0.08);
      --docs-border: oklch(74% 0.025 72 / 0.12);
      --docs-border-strong: oklch(74% 0.025 72 / 0.17);
      --docs-text: oklch(86% 0.012 78);
      --docs-text-strong: oklch(94% 0.01 80);
      --docs-text-soft: oklch(78% 0.012 78);
      --docs-text-muted: oklch(72% 0.011 78);
      --docs-text-utility: oklch(64% 0.01 78);
      --docs-accent: oklch(76% 0.09 70);
      --docs-accent-secondary: oklch(72% 0.065 48);
      --docs-accent-tertiary: oklch(80% 0.08 88);
      --docs-accent-cool: oklch(64% 0.045 246);
      --docs-accent-cool-soft: oklch(64% 0.045 246 / 0.26);
      --docs-danger: oklch(68% 0.08 48);
      --docs-shadow: 0 24px 80px oklch(8% 0.01 76 / 0.45);
      --docs-radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background:
        radial-gradient(circle at top, oklch(76% 0.09 70 / 0.14), transparent 32%),
        linear-gradient(180deg, var(--docs-bg-darker) 0%, var(--docs-bg) 58%, oklch(14% 0.012 76) 100%);
    }

    body {
      background: transparent;
      color: var(--docs-text);
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #redoc {
      min-height: 100vh;
    }

    #redoc .redoc-wrap {
      background: transparent !important;
    }

    #redoc .menu-content {
      background:
        linear-gradient(180deg, oklch(20% 0.013 76 / 0.98), oklch(18% 0.012 76 / 0.98)) !important;
      border-right: 1px solid var(--docs-border);
      box-shadow: inset -1px 0 0 var(--docs-border-subtle);
    }

    #redoc .menu-content [role='search'] {
      padding-top: 18px;
      background: transparent !important;
    }

    #redoc .menu-content .search-input {
      color: var(--docs-text) !important;
      border-bottom: 1px solid var(--docs-border) !important;
      font-size: 14px !important;
      letter-spacing: 0.01em;
      font-family: inherit !important;
    }

    #redoc .menu-content .search-input::placeholder {
      color: var(--docs-text-utility) !important;
    }

    #redoc .menu-content .search-icon path,
    #redoc .menu-content label svg polygon,
    #redoc .menu-content .operation-type {
      color: var(--docs-text-muted) !important;
      fill: var(--docs-text-muted) !important;
    }

    #redoc .menu-content li,
    #redoc .menu-content label,
    #redoc .menu-content span,
    #redoc .menu-content a {
      color: var(--docs-text-muted) !important;
    }

    #redoc .menu-content li.active > label,
    #redoc .menu-content li:hover > label,
    #redoc .menu-content li:hover span,
    #redoc .menu-content li[aria-current='true'] > label,
    #redoc .menu-content li[aria-expanded='true'] > label {
      color: var(--docs-text) !important;
    }

    #redoc .menu-content li > label {
      border-radius: 12px;
      margin-inline: 10px;
      transition: background-color 160ms ease, color 160ms ease;
    }

    #redoc .menu-content li:hover > label,
    #redoc .menu-content li[aria-expanded='true'] > label {
      background: oklch(76% 0.09 70 / 0.08) !important;
    }

    #redoc .menu-content .operation-type,
    #redoc .menu-content .operation-type.post {
      background: oklch(84% 0.015 78 / 0.05) !important;
      color: var(--docs-text-soft) !important;
      border: 1px solid var(--docs-border) !important;
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
      font-size: 0.72rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #redoc .menu-content .operation-type.get {
      background: oklch(80% 0.08 88 / 0.12) !important;
      color: var(--docs-accent-tertiary) !important;
      border-color: oklch(80% 0.08 88 / 0.18) !important;
    }

    #redoc .menu-content .operation-type.post {
      background: oklch(76% 0.09 70 / 0.12) !important;
      color: var(--docs-accent) !important;
      border-color: oklch(76% 0.09 70 / 0.18) !important;
    }

    #redoc .menu-content .operation-type.put,
    #redoc .menu-content .operation-type.patch {
      background: oklch(72% 0.065 48 / 0.12) !important;
      color: var(--docs-accent-secondary) !important;
      border-color: oklch(72% 0.065 48 / 0.18) !important;
    }

    #redoc .menu-content .operation-type.delete {
      background: oklch(68% 0.08 48 / 0.12) !important;
      color: var(--docs-danger) !important;
      border-color: oklch(68% 0.08 48 / 0.18) !important;
    }

    #redoc .menu-content .operation-type.options,
    #redoc .menu-content .operation-type.head {
      background: oklch(64% 0.045 246 / 0.12) !important;
      color: var(--docs-accent-cool) !important;
      border-color: oklch(64% 0.045 246 / 0.18) !important;
    }

    #redoc .menu-content > div:last-child {
      background: oklch(20% 0.013 76 / 0.98) !important;
      border-top: 1px solid var(--docs-border);
    }

    #redoc .menu-content > div:last-child a,
    #redoc .menu-content > div:last-child a:visited {
      color: var(--docs-text-muted) !important;
    }

    #redoc .api-content {
      background: transparent !important;
    }

    #redoc .api-content > div {
      border-bottom: 1px solid var(--docs-border-subtle) !important;
    }

    #redoc .api-content > div > div:first-child {
      background: linear-gradient(180deg, oklch(16% 0.012 76 / 0.96), oklch(18% 0.012 76 / 0.98)) !important;
      color: var(--docs-text) !important;
    }

    #redoc .api-content > div > div:last-child,
    #redoc .redoc-wrap > div:last-child {
      background: linear-gradient(180deg, oklch(24% 0.014 76 / 0.96), oklch(20% 0.013 76 / 0.98)) !important;
      color: var(--docs-text) !important;
      box-shadow: var(--docs-shadow);
    }

    #redoc .api-content h1,
    #redoc .api-content h2,
    #redoc .api-content h3,
    #redoc .api-content h4,
    #redoc .api-content h5,
    #redoc .api-content strong,
    #redoc .api-content label,
    #redoc .api-content table,
    #redoc .api-content button {
      color: inherit;
    }

    #redoc .api-content h1,
    #redoc .api-content h2 {
      color: var(--docs-text-strong) !important;
      letter-spacing: -0.03em;
    }

    #redoc .api-content h3,
    #redoc .api-content h4,
    #redoc .api-content h5,
    #redoc .api-content strong {
      color: var(--docs-text) !important;
    }

    #redoc .api-content p,
    #redoc .api-content li,
    #redoc .api-content td,
    #redoc .api-content label,
    #redoc .api-content ul,
    #redoc .api-content ol,
    #redoc .api-content blockquote {
      color: var(--docs-text-muted);
    }

    #redoc .api-content table tr,
    #redoc .api-content table tr:nth-child(2n) {
      background: oklch(18% 0.012 76 / 0.62) !important;
      border-top: 1px solid var(--docs-border-subtle) !important;
    }

    #redoc .api-content table th,
    #redoc .api-content table td {
      border: 1px solid var(--docs-border) !important;
    }

    #redoc .api-content table th {
      color: var(--docs-text-soft) !important;
      background: oklch(24% 0.014 76 / 0.52) !important;
    }

    #redoc .api-content code,
    #redoc .api-content pre,
    #redoc .api-content pre code {
      font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace !important;
    }

    #redoc .api-content :not(pre) > code {
      color: var(--docs-accent-secondary) !important;
      background: oklch(84% 0.015 78 / 0.05) !important;
      border: 1px solid var(--docs-border) !important;
      border-radius: 10px;
      padding: 0.1rem 0.45rem !important;
    }

    #redoc .api-content pre,
    #redoc .api-content .react-tabs__tab-panel,
    #redoc .api-content .react-tabs__tab-panel > div,
    #redoc .api-content .react-tabs__tab-panel > pre {
      background: var(--docs-card) !important;
      color: var(--docs-text) !important;
    }

    #redoc .api-content pre {
      border: 1px solid var(--docs-border) !important;
      border-radius: 14px;
    }

    #redoc .react-tabs__tab-list,
    #redoc [role='tablist'] {
      gap: 8px;
    }

    #redoc .react-tabs__tab,
    #redoc [role='tab'] {
      background: oklch(84% 0.015 78 / 0.05) !important;
      color: var(--docs-text-muted) !important;
      border: 1px solid var(--docs-border) !important;
      border-radius: 12px !important;
      font-weight: 700 !important;
    }

    #redoc .react-tabs__tab--selected,
    #redoc [role='tab'][aria-selected='true'] {
      background: var(--docs-text-strong) !important;
      color: var(--docs-bg) !important;
      border-color: transparent !important;
      box-shadow: 0 10px 30px oklch(8% 0.01 76 / 0.22);
    }

    #redoc button[disabled] {
      opacity: 0.72;
    }

    #redoc button[disabled],
    #redoc .api-content button {
      border-radius: 14px;
    }

    #redoc a,
    #redoc a:visited {
      color: var(--docs-accent) !important;
    }

    #redoc a:hover {
      color: var(--docs-accent-tertiary) !important;
    }

    #redoc :focus-visible {
      outline: 2px solid var(--docs-accent-cool) !important;
      outline-offset: 2px;
      box-shadow: 0 0 0 4px var(--docs-accent-cool-soft);
    }

    @media (max-width: 75rem) {
      #redoc .api-content > div > div:first-child,
      #redoc .api-content > div > div:last-child,
      #redoc .redoc-wrap > div:last-child {
        box-shadow: none;
      }
    }
